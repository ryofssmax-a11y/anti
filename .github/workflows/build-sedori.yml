name: Build eBay sedori app (Windows)
on:
  push:
    branches: [main, "claude/**", "ccr-**"]
    paths: ["sedori/**", ".github/workflows/build-sedori.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sedori
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: sedori-installer
          path: sedori/dist/*.exe
