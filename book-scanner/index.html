<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>ブックスキャナ</title>
<style>
:root{--bg:#111827;--panel:#1f2937;--fg:#f9fafb;--mut:#9ca3af;--acc:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:12px 0 32px}
h1{font-size:18px;margin:8px 0}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden}
video{width:100%;display:block;max-height:60vh;object-fit:contain}
#status{position:absolute;left:8px;top:8px;background:#000a;padding:2px 10px;border-radius:99px;font-size:13px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
button{background:var(--panel);color:var(--fg);border:1px solid #374151;border-radius:8px;padding:10px 14px;font:inherit}
button.pri{background:var(--acc);color:#052e16;border-color:var(--acc);font-weight:700}
button:disabled{opacity:.4}
select,input[type=text]{background:var(--panel);color:var(--fg);border:1px solid #374151;border-radius:8px;padding:8px;font:inherit;width:100%}
label{color:var(--mut);font-size:13px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.th{position:relative;background:var(--panel);border-radius:6px;overflow:hidden}
.th img{width:100%;display:block}
.th b{position:absolute;left:4px;top:2px;font-size:12px;background:#000a;padding:0 6px;border-radius:4px}
.th button{position:absolute;right:2px;top:2px;padding:0 8px;font-size:12px}
details{background:var(--panel);border-radius:8px;padding:8px 12px;margin:10px 0}
#msg{color:var(--mut);min-height:1.5em}
a{color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>📚 ブックスキャナ</h1>
<div class="cam">
  <video id="video" playsinline muted></video>
  <div id="status">待機中</div>
  <div id="flash"></div>
</div>
<div class="row">
  <button id="startCam" class="pri">カメラ開始</button>
  <button id="shot" disabled>撮影</button>
  <label><input type="checkbox" id="auto" checked> 自動撮影(ページをめくると撮る)</label>
</div>
<div class="row">
  <div style="flex:1;min-width:140px"><label>画質補正</label>
    <select id="mode"><option value="gray">白黒(グレー・おすすめ)</option><option value="bw">2値(文字くっきり)</option><option value="color">カラー</option></select></div>
  <div style="flex:1;min-width:140px"><label>回転</label>
    <select id="rot"><option value="0">なし</option><option value="90">右90°</option><option value="180">180°</option><option value="270">左90°</option></select></div>
</div>
<div class="row"><b id="count">0 ページ</b><button id="undo">最後を削除</button><button id="clear">全削除</button></div>
<div class="thumbs" id="thumbs"></div>

<h2 style="font-size:16px">PDFにする</h2>
<label>ファイル名</label>
<input type="text" id="title" placeholder="本のタイトル">
<div class="row">
  <button id="dl" class="pri" disabled>PDFを保存</button>
  <button id="up" disabled>Google Driveに保存</button>
</div>
<label><input type="checkbox" id="ocrDoc"> OCR済みGoogleドキュメントも作る(Driveが文字認識)</label>
<div id="msg"></div>

<details>
<summary>設定(Google連携)</summary>
<p style="color:var(--mut)">Google CloudでOAuthクライアントID(種類: ウェブアプリ)を作り、Drive APIを有効化、承認済みJavaScript生成元にこのページのURLを追加して、IDを貼り付けます。手順は README を参照。</p>
<input type="text" id="cid" placeholder="xxxx.apps.googleusercontent.com">
<div class="row"><button id="saveCid">保存</button></div>
</details>
</main>
<script src="pdf.js"></script>
<script src="app.js"></script>
</body>
</html>
