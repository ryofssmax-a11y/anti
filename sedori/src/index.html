<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>eBayせどり管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand">eBayせどり管理</div>
    <button class="nav" data-tab="dashboard">ダッシュボード</button>
    <button class="nav" data-tab="research">リサーチ・利益計算</button>
    <button class="nav" data-tab="watch">ウォッチリスト</button>
    <button class="nav" data-tab="inventory">在庫・販売管理</button>

    <div class="rate" id="rateBox"></div>

<div id="toast" role="status"></div>

<script src="calc.js"></script>
